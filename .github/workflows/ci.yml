name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the repo.
permissions:
  contents: read

jobs:
  hadolint:
    name: Lint Dockerfiles (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.service }}/Dockerfile
          failure-threshold: warning

  manifests:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # kubeconform ships as a plain binary (no official Action). Version and SHA-256 are
      # pinned here, so a swapped or corrupted download fails the job instead of running.
      - name: Install kubeconform v0.8.0
        env:
          SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -fsSL -o kc.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          echo "$SHA256  kc.tar.gz" | sha256sum -c -
          tar -xzf kc.tar.gz kubeconform
      # -strict rejects unknown fields (catches typos like "replica:"). Skipped: kind-config.yaml
      # (kind-specific type, no Kubernetes schema) and traefik-values.yaml (Helm values, not an object).
      - name: Validate raw manifests against Kubernetes 1.34 schemas
        run: |
          ./kubeconform -strict -summary -kubernetes-version 1.34.0             -ignore-filename-pattern 'kind-config\.yaml'             -ignore-filename-pattern 'traefik-values\.yaml' k8s/
      # Same pinning approach as kubeconform: version + SHA-256 (from get.helm.sh).
      - name: Install helm v4.3.1
        env:
          SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "$SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm
          echo "$PWD/linux-amd64" >> "$GITHUB_PATH"
      # Lint, then render each environment and validate the RENDERED objects: a template can be
      # valid YAML-in-Helm and still render an invalid Kubernetes object.
      - name: Lint and validate the Helm chart (dev and prod values)
        run: |
          for env in dev prod; do
            echo "::group::chart ($env values)"
            helm lint charts/routing -f charts/routing/values-$env.yaml --strict
            helm template routing charts/routing -n routing -f charts/routing/values-$env.yaml               | ./kubeconform -strict -summary -kubernetes-version 1.34.0 -
            echo "::endgroup::"
          done

  alerts:
    name: Validate alert rules and dashboard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same helm pin as the manifests job. The rules only render with monitoring.enabled=true.
      - name: Install helm v4.3.1
        env:
          SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "$SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm && sudo mv linux-amd64/helm /usr/local/bin/helm
      # promtool is Prometheus's own checker; a typo in a PromQL rule would otherwise silently produce no alert.
      - name: promtool check rules
        run: |
          helm template routing charts/routing -n routing -f charts/routing/values-dev.yaml --set monitoring.enabled=true --show-only templates/monitoring.yaml | yq 'select(.kind == "PrometheusRule") | {"groups": .spec.groups}' > rules.yaml
          docker run --rm --entrypoint promtool -v "$PWD:/w:ro" quay.io/prometheus/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 check rules /w/rules.yaml
      - name: Dashboard JSON is valid and has panels
        run: python3 -c "import json; d=json.load(open('charts/routing/files/dashboard.json')); assert len(d['panels'])>=8, 'too few panels'; print('dashboard OK:', len(d['panels']), 'panels')"

  iac:
    name: Terraform checks and secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same pinning approach as the other tools: version + SHA-256 (from releases.hashicorp.com).
      - name: Install terraform v1.16.6
        env:
          SHA256: 38034b38d03096399a7a1264a14561a8029b2b496fd1f169452656e53968f1b7
        run: |
          curl -fsSL -o tf.zip https://releases.hashicorp.com/terraform/1.16.6/terraform_1.16.6_linux_amd64.zip
          echo "$SHA256  tf.zip" | sha256sum -c -
          # Extract into a temp dir: the repo has its own terraform/ directory, which unzip would prompt about.
          unzip -q tf.zip -d "$RUNNER_TEMP/tf" && sudo mv "$RUNNER_TEMP/tf/terraform" /usr/local/bin/terraform
      # -backend=false: no account, credentials or state are needed to validate. The AWS code is a
      # reference design and is never applied; validation is all CI can (and should) do for it.
      - name: fmt, init and validate (local stack and AWS reference)
        run: |
          for dir in terraform/local terraform/aws-reference; do
            echo "::group::$dir"
            terraform -chdir=$dir fmt -check -diff
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done
      # Misconfiguration scan of our own IaC. Accepted findings live in .trivyignore, each with a reason.
      - name: Trivy IaC scan (AWS reference)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/aws-reference
          severity: HIGH,CRITICAL
          exit-code: '1'
          trivyignores: terraform/aws-reference/.trivyignore
          skip-dirs: terraform/aws-reference/.terraform
          format: table
      # Fails the build if a private key, token or kubeconfig credential is committed anywhere.
      - name: Trivy secret scan (whole repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          skip-dirs: .git
          format: table

  build:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: hadolint   # don't spend build minutes on a Dockerfile that fails lint
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false          # publish comes in a later step, after the scan
          load: true           # make the image available to the scanner below
          tags: ${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Pinned to a commit SHA, not a tag: this action was hit by a supply-chain attack
      # earlier this year, and a tag can be moved but a SHA cannot. (v0.36.0)
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true   # only fail on CVEs that have a fix available
          exit-code: '1'         # non-zero exit fails the job
          format: table
      # Hand the exact scanned image to the publish job (no rebuild, so scanned == shipped)
      - name: Save scanned image
        run: docker save ${{ matrix.service }}:ci -o ${{ matrix.service }}.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: ${{ matrix.service }}.tar
          retention-days: 1

  e2e:
    name: Deploy to an ephemeral cluster, smoke test, roll back
    runs-on: ubuntu-24.04
    needs: build        # uses the exact images the build job scanned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
      # Same pinning approach as kubeconform and helm: version + SHA-256.
      - name: Install kind v0.33.0 and helm v4.3.1
        env:
          KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          curl -fsSL -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "$KIND_SHA256  kind" | sha256sum -c -
          chmod +x kind && sudo mv kind /usr/local/bin/kind
          curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz linux-amd64/helm && sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Create the cluster and load the images built by this run
        run: |
          sed "s|__DATA_DIR__|$PWD/ci/data|" ci/kind-config.yaml > /tmp/kind-config.yaml
          kind create cluster --config /tmp/kind-config.yaml --wait 120s
          kind load image-archive backend.tar --name ci
          kind load image-archive frontend.tar --name ci
      - name: Install Traefik
        run: helm upgrade --install traefik oci://ghcr.io/traefik/helm/traefik --version 42.0.0 -n traefik --create-namespace -f k8s/traefik-values.yaml --wait --timeout 5m
      # The first start builds Valhalla's tiles from the small fixture (about two minutes).
      - name: Deploy the chart (revision 1)
        run: helm upgrade --install routing charts/routing -n routing --create-namespace -f charts/routing/values-dev.yaml -f ci/values-ci.yaml --wait --timeout 10m
      - name: Smoke test the healthy deployment
        run: ./scripts/smoke-test.sh
      # A broken release must fail loudly AND must not take the service down.
      - name: Break the deploy on purpose (image tag that does not exist)
        run: |
          if helm upgrade routing charts/routing -n routing -f charts/routing/values-dev.yaml -f ci/values-ci.yaml --set-string astar.image.tag=does-not-exist --wait --timeout 90s; then
            echo "::error::the broken upgrade unexpectedly succeeded"; exit 1
          fi
          echo "the broken upgrade failed, as intended"
          kubectl -n routing get pods
          helm history routing -n routing
      - name: The service is still up during the failed rollout
        run: ./scripts/smoke-test.sh
      - name: Roll back to revision 1
        run: |
          helm rollback routing 1 -n routing --wait --timeout 3m
          helm history routing -n routing
          img=$(kubectl -n routing get deploy routing-astar -o jsonpath='{.spec.template.spec.containers[0].image}')
          test "$img" = "backend:ci" || { echo "::error::astar image is $img after rollback"; exit 1; }
      - name: Smoke test after the rollback
        run: ./scripts/smoke-test.sh
      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n routing describe pods || true
          kubectl -n routing logs deploy/routing-valhalla --tail=80 || true
          kubectl -n routing logs deploy/routing-astar --tail=40 || true

  publish:
    name: Publish image (${{ matrix.service }})
    runs-on: ubuntu-24.04
    needs: [build, manifests, e2e, iac]   # scans pass, manifests validate, deploy + rollback works, no leaked secrets
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # The only job allowed to write packages; PR runs never get this.
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}
      - name: Load scanned image
        run: docker load -i ${{ matrix.service }}.tar
      # No stored password: the workflow's own short-lived token logs in to GHCR.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name (registries reject uppercase)
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest
      - name: Tag and push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "$TAGS" | while read -r tag; do
            docker tag ${{ matrix.service }}:ci "$tag"
            docker push "$tag"
          done
