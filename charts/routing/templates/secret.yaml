{{- /*
  Intentionally empty by default: the app has no real secrets today (no credentials, public images).
  The mechanism exists for the day one appears. Supply values at install time, never in a values file
  committed to git:   helm install ... --set-string secrets.SOME_KEY=value
*/ -}}
{{- if .Values.secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-valhalla-secret
  labels:
    {{- include "routing.labels" . | nindent 4 }}
    app.kubernetes.io/component: valhalla
type: Opaque
stringData:
  {{- range $name, $value := .Values.secrets }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
{{- end }}
