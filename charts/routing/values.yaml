# Defaults. Environment differences live in values-dev.yaml / values-prod.yaml.

astar:
  replicas: 1                 # used only when autoscaling is disabled
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3            # each replica holds ~470 MiB (the road graph), so this is also a memory cap
    targetCPUUtilizationPercentage: 70   # of the CPU *request*, not of the node
  image:
    repository: ghcr.io/abhithapliyal05/maprouting/backend
    tag: sha-9df887e          # immutable commit tag, never "latest"
  port: 8003
  resources:
    # From the load test (docs/capacity-report.md): one replica saturates at ~3 req/s using 0.23-0.27 CPU cores per
    # req/s, so with a 70% HPA target a 600m request scales out at ~0.42 cores = ~1.6-1.9 req/s, roughly half the knee.
    # Memory is flat at ~430 MiB at every load (it holds the road graph), so 768Mi is ~1.8x the measured use.
    requests: {cpu: 600m, memory: 512Mi}
    limits: {memory: 768Mi}

persistence:
  # Dev: a hostPath PV backed by the kind node's mounted folder (see k8s/kind-config.yaml).
  # Prod: set hostPath.enabled=false and provide a storageClass (EKS, Day 5).
  hostPath:
    enabled: true
    path: /data-host
  accessModes: [ReadWriteOnce]
  storageClass: manual
  size: 20Gi

valhalla:
  replicas: 1
  # Same digest as docker-compose.yml
  image:
    repository: ghcr.io/gis-ops/docker-valhalla/valhalla
    digest: sha256:060da5b92e6024a67f65135c236d918b021d63e73d1808a0d55b7e7cbd17240c
  port: 8002
  env:
    server_threads: "2"
    build_elevation: "False"
    build_admins: "True"          # only builds if the admin db is missing
    build_time_zones: "False"
    build_tar: "True"
    use_tiles_ignore_pbf: "True"  # load existing tiles; never rebuild from the .pbf
  # From the load test (docs/capacity-report.md): one replica handles ~30 req/s (p95 192 ms) and uses ~1.0 core at
  # 20 req/s, a comfortable operating point. Memory peaked at 172 MiB, but only central-Tokyo trips were tested and
  # the tiles are memory-mapped, so the limit keeps generous headroom.
  resources:
    requests: {cpu: 1000m, memory: 256Mi}
    limits: {memory: 1Gi}

frontend:
  replicas: 1                 # used only when autoscaling is disabled
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  image:
    repository: ghcr.io/abhithapliyal05/maprouting/frontend
    tag: sha-9df887e
  port: 8080
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {memory: 128Mi}      # measured ~18 MiB

# Extra environment variables for Valhalla that must NOT live in git (none exist today).
# Pass with: --set-string secrets.NAME=value
secrets: {}

# Runtime config served to the browser as /config.js (the browser calls the backends directly,
# so these must be URLs the *browser* can reach). No defaults: each environment must set them.
frontend_config:
  valhallaUrl: ""
  astarUrl: ""

ingress:
  enabled: true
  className: ""        # empty = the cluster's default IngressClass
  hosts:
    app: ""            # required when ingress.enabled
    valhalla: ""
    astar: ""

# Dashboard and alert rules. Needs the Prometheus Operator CRDs and Grafana's dashboard sidecar
# (kube-prometheus-stack), so it is off by default; terraform/local turns it on.
monitoring:
  enabled: false
  alerts:
    errorRatePercent: 5        # RoutingHighErrorRate: share of 5xx responses
    latencyP95Seconds: 2       # RoutingHighLatencyP95
