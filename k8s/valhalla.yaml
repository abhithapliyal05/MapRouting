apiVersion: apps/v1
kind: Deployment
metadata:
  name: valhalla
  namespace: routing
  labels: {app: valhalla}
spec:
  replicas: 1
  strategy:
    type: Recreate        # one pod owns the data volume; never run two during a rollout
  selector:
    matchLabels: {app: valhalla}
  template:
    metadata:
      labels: {app: valhalla}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 59999
        runAsGroup: 59999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valhalla
          # Same digest as docker-compose.yml
          image: ghcr.io/gis-ops/docker-valhalla/valhalla@sha256:060da5b92e6024a67f65135c236d918b021d63e73d1808a0d55b7e7cbd17240c
          ports:
            - {name: http, containerPort: 8002}
          env:
            - {name: server_threads, value: "2"}
            - {name: build_elevation, value: "False"}
            - {name: build_admins, value: "True"}       # only builds if the admin db is missing
            - {name: build_time_zones, value: "False"}
            - {name: build_tar, value: "True"}
            - {name: use_tiles_ignore_pbf, value: "True"}  # load existing tiles; never rebuild from the .pbf
          # Hardening exception: the image's entrypoint runs its commands through sudo,
          # so allowPrivilegeEscalation must stay true and capabilities can't be dropped.
          # It still runs as a non-root user (59999). Unlike the A* pod, the root filesystem is writable.
          securityContext:
            allowPrivilegeEscalation: true
          volumeMounts:
            # read-write: the entrypoint rewrites valhalla.json and fixes file permissions here
            - {name: map-data, mountPath: /custom_files}
          # NOT yet load-tested: 151 MiB idle in Compose. Tiles are memory-mapped, so usage
          # grows with traffic. Day 8 (k6 load test) sets the real numbers.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 2Gi}
          startupProbe:
            httpGet: {path: /status, port: http}
            periodSeconds: 10
            failureThreshold: 30     # up to 5 min
          readinessProbe:
            httpGet: {path: /status, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /status, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data
---
apiVersion: v1
kind: Service
metadata:
  name: valhalla
  namespace: routing
spec:
  selector: {app: valhalla}
  ports:
    - {name: http, port: 8002, targetPort: http}
