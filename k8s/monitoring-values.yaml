# kube-prometheus-stack for the LOCAL kind cluster: small footprint, nothing persisted.
# Installed by terraform/local (release name "monitoring"). The Grafana admin password is generated by
# Terraform and passed as a sensitive value; it is deliberately not set here.

# kind does not expose the control-plane components these target, so they would only show as "down".
defaultRules:
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false
    kubeProxy: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

# Extra node-level metrics are not needed for this project and node-exporter needs host mounts.
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 12h
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from every namespace, not only
    # those labelled with this Helm release (the app and Traefik live in other namespaces).
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: {cpu: 200m, memory: 400Mi}
      limits: {memory: 1Gi}

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}

grafana:
  defaultDashboardsTimezone: browser
  persistence:
    enabled: false
  sidecar:
    dashboards:
      searchNamespace: ALL   # find dashboard ConfigMaps (label grafana_dashboard=1) in any namespace
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
