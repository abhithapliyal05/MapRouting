apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: routing
  labels: {app: frontend}
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101           # the "nginx" user baked into nginx-unprivileged
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: ghcr.io/abhithapliyal05/maprouting/frontend:sha-3e3e93b
          ports:
            - {name: http, containerPort: 8080}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # nginx needs somewhere writable for its pid file and temp/cache dirs
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: cache, mountPath: /var/cache/nginx}
          # Measured: ~18 MiB in Compose
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: routing
spec:
  selector: {app: frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
