apiVersion: apps/v1
kind: Deployment
metadata:
  name: astar
  namespace: routing
  labels: {app: astar}
spec:
  replicas: 1
  selector:
    matchLabels: {app: astar}
  template:
    metadata:
      labels: {app: astar}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: astar
          image: ghcr.io/abhithapliyal05/maprouting/backend:sha-3e3e93b
          ports:
            - {name: http, containerPort: 8003}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: map-data, mountPath: /app/data, readOnly: true}
          # Measured: ~470 MiB steady state in Compose. Limit leaves ~1.6x headroom.
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 768Mi}
          # The graph is built before the server listens, so give startup room first;
          # liveness/readiness only begin once this succeeds.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30     # up to 150 s
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: map-data
          persistentVolumeClaim:
            claimName: map-data
---
apiVersion: v1
kind: Service
metadata:
  name: astar
  namespace: routing
spec:
  selector: {app: astar}
  ports:
    - {name: http, port: 8003, targetPort: http}
