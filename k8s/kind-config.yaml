# Local cluster for Day 3. Recreate with:
#   kind create cluster --name routing --config k8s/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: routing
nodes:
  - role: control-plane
    # Pinned by digest, pulled via mirror.gcr.io (Docker Hub's CDN was unreachable over IPv6).
    # Kubernetes 1.34 to match the local kubectl and a version EKS supports.
    image: mirror.gcr.io/kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraMounts:
      # Makes the host's map data visible inside the node at /data-host (local-only shortcut;
      # a PersistentVolume will point at it). Cannot be added after cluster creation.
      - hostPath: C:/MapProject/data
        containerPath: /data-host
