# Cluster config for the CI end-to-end job (see .github/workflows/ci.yml).
# __DATA_DIR__ is replaced with the absolute path of ci/data on the runner.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ci
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8088, listenAddress: "127.0.0.1", protocol: TCP}
    extraMounts:
      - {hostPath: __DATA_DIR__, containerPath: /data-host}
