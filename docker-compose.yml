services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla@sha256:060da5b92e6024a67f65135c236d918b021d63e73d1808a0d55b7e7cbd17240c
    container_name: local_routing_engine
    ports:
      - "8002:8002"
    volumes:
      - ./data:/custom_files
    environment:
      - server_threads=2
      - build_elevation=False
      - build_admins=True
      - build_time_zones=False
      - build_tar=True